<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrepPulse - Placement Preparation Portal</title>
  <meta name="description" content="Comprehensive placement preparation portal with company tracks, aptitude practice, DSA roadmap, and HR interview guides.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="app-container">
    <!-- Mobile Sidebar Backdrop Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="brand-header">
        <div class="brand-logo-icon">🚀</div>
        <div class="brand-text">
          <h1>PrepPulse</h1>
          <p>Placement Portal</p>
        </div>
      </div>

      <nav class="nav-menu">
        <button class="nav-item active" data-view="dashboard" id="nav-dashboard">
          <span class="nav-item-icon">📊</span>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-view="companies" id="nav-companies">
          <span class="nav-item-icon">🏢</span>
          <span>Company Tracks</span>
        </button>
        <button class="nav-item" data-view="practice" id="nav-practice">
          <span class="nav-item-icon">⚡</span>
          <span>Practice & Quizzes</span>
        </button>
        <button class="nav-item" data-view="roadmap" id="nav-roadmap">
          <span class="nav-item-icon">🗺️</span>
          <span>DSA Roadmap</span>
        </button>
        <button class="nav-item" data-view="hr" id="nav-hr">
          <span class="nav-item-icon">💬</span>
          <span>HR & Resume Guide</span>
        </button>
        <button class="nav-item" data-view="bookmarks" id="nav-bookmarks">
          <span class="nav-item-icon">⭐</span>
          <span>Saved Bookmarks</span>
        </button>
      </nav>
    </aside>

    <!-- Main Application Area -->
    <div class="main-wrapper">
      <!-- Top Navigation Header -->
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-trigger" id="mobileMenuBtn" aria-label="Toggle Menu">☰</button>
          <h2 class="page-title" id="pageTitle">Placement Prep Dashboard</h2>
        </div>

        <div class="header-right">
          <div class="search-input-group">
            <span class="search-icon">🔍</span>
            <input type="text" id="globalSearchInput" placeholder="Search topic, company, Qs...">
          </div>
          
          <div class="user-streak-badge">
            <span>🔥 5 Day Streak</span>
          </div>

          <!-- Auth User Action / Profile Button -->
          <div id="authHeaderContainer">
            <button class="btn-auth-trigger" id="openAuthBtn">Sign In</button>
          </div>
        </div>
      </header>

      <!-- Dynamic Page Body -->
      <main class="content-body" id="contentContainer">
        <!-- Injected dynamically by app.js -->
      </main>

      <!-- Mobile Bottom Navigation Bar -->
      <nav class="mobile-bottom-nav" id="mobileBottomNav">
        <button class="bottom-nav-item active" data-view="dashboard">
          <span class="bottom-nav-icon">📊</span>
          <span>Home</span>
        </button>
        <button class="bottom-nav-item" data-view="companies">
          <span class="bottom-nav-icon">🏢</span>
          <span>Tracks</span>
        </button>
        <button class="bottom-nav-item" data-view="practice">
          <span class="bottom-nav-icon">⚡</span>
          <span>Practice</span>
        </button>
        <button class="bottom-nav-item" data-view="roadmap">
          <span class="bottom-nav-icon">🗺️</span>
          <span>Roadmap</span>
        </button>
        <button class="bottom-nav-item" data-view="hr">
          <span class="bottom-nav-icon">💬</span>
          <span>HR Guide</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- AUTH MODAL (LOGIN & SIGNUP) -->
  <div class="auth-modal-backdrop" id="authModal">
    <div class="auth-modal-card">
      <button class="btn-close-modal" id="closeAuthBtn">&times;</button>
      
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tabLoginBtn">Sign In</button>
        <button class="auth-tab-btn" id="tabSignupBtn">Create Account</button>
      </div>

      <!-- LOGIN FORM -->
      <form class="auth-form active" id="loginForm">
        <h3 class="auth-title">Welcome Back to PrepPulse</h3>
        <p class="auth-subtitle">Sign in to track your placement readiness & quiz scores.</p>

        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" placeholder="student@college.edu" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 0.8rem;">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" checked style="accent-color: var(--primary);"> Remember me
          </label>
          <a href="#" onclick="alert('Password reset link sent to your registered email.')" style="color: var(--primary); text-decoration: none; font-weight: 600;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-primary-auth">Sign In to Dashboard</button>
      </form>

      <!-- SIGNUP FORM -->
      <form class="auth-form" id="signupForm">
        <h3 class="auth-title">Create PrepPulse Account</h3>
        <p class="auth-subtitle">Start your targeted placement prep for top IT companies.</p>

        <div class="form-group">
          <label for="signupName">Full Name</label>
          <input type="text" id="signupName" placeholder="your name" required>
        </div>

        <div class="form-group">
          <label for="signupEmail">Email Address</label>
          <input type="email" id="signupEmail" placeholder="your email" required>
        </div>

        <div class="form-group">
          <label for="signupDept">Department / Degree</label>
          <select id="signupDept" required style="width: 100%; padding: 10px; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); font-family: inherit; font-size: 0.88rem; background: var(--bg-subtle);">
            <option value="B.E Computer Science & Engg">B.E Computer Science & Engg</option>
            <option value="B.Tech Information Tech">B.Tech Information Tech</option>
            <option value="B.E Electronics & Comm">B.E Electronics & Comm</option>
            <option value="B.E Electrical & Electronics">B.E Electrical & Electronics</option>
            <option value="MCA / M.Sc Computer Science">MCA / M.Sc Computer Science</option>
          </select>
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="••••••••" required minlength="6">
        </div>

        <button type="submit" class="btn-primary-auth">Create My Free Account</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
